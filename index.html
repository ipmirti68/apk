/* --- M3U PARSER: çok satırlı EXTINF desteği --- */
function parseM3U(text){
  const raw=text.split('\n').map(l=>l.trim()).filter(l=>l);
  const chs=[];let buf=null; // buf = birleştirilmiş EXTINF satırı
  const flushUrl=url=>{
    if(!buf) return;
    const m=t=>{const r=buf.match(new RegExp(t+'="([^"]*)"','i'));return r?r[1]:''};
    let headers={};
    const ref=m('http-referrer')||m('http-referer'); if(ref)headers['Referer']=ref;
    const ua=m('http-user-agent'); if(ua)headers['User-Agent']=ua;
    const nm=buf.match(/,\s*([^,]+)$/); const name=nm?nm[1].trim():'Kanal '+(chs.length+1);
    let type='hls'; const ul=url.toLowerCase();
    if(ul.includes('.mpd'))type='dash'; else if(ul.includes('.mp4')&&!ul.includes('.m3u'))type='mp4';
    chs.push({id:name.toLowerCase().replace(/[^a-z0-9]/g,'_').slice(0,25)+'_'+chs.length,num:chs.length+1,name,url,type,logo:m('tvg-logo'),group:m('group-title')||'Diğer',tvgId:m('tvg-id'),headers,kodiProps:{}});
    buf=null;
  };
  for(let i=0;i<raw.length;i++){
    const L=raw[i];
    if(L.startsWith('#EXTM3U')) continue;
    if(L.startsWith('#EXTINF:')){ buf=L; continue; }
    // EXTINF devam satırı: henüz URL gelmedi ve satır # ile başlamıyor ve virgül içeren attribute satırıysa birleştir
    if(buf && !L.startsWith('#') && !L.startsWith('http') && !L.includes('://') && L.includes('=')){
      buf+=' '+L; continue;
    }
    if(L.startsWith('#EXTVLCOPT:')){
      const m=L.match(/#EXTVLCOPT:(.+?)=(.+)/i);
      if(m && buf){ const k=m[1].trim().toLowerCase(),v=m[2].trim(); if(k.includes('referr')) buf+=' http-referrer="'+v+'"'; else if(k.includes('user-agent')) buf+=' http-user-agent="'+v+'"'; }
      continue;
    }
    if(L.startsWith('#KODIPROP:')) continue;
    if(L.startsWith('#')) continue;
    if(buf){ flushUrl(L); }
  }
  return chs;
}

onPlay(){this.playing=true;this.showL(false);this.showE(false);this.retry=0;$('bPP').querySelector('i').className='fas fa-pause';this.showC()},onBuf(){this.showL(true)},onFail(){this.fail()},
fail(){if(this.retry<this.maxR&&this.ch){this.retry++;this.showL(true);this.rT=setTimeout(()=>{this.kill();const p=this.retry>=this.maxR-1?this.loadDirect(this.ch.url):this.load(this.ch);p.catch(()=>this.fail())},2000*this.retry)}else{this.showE(true,'Yayın açılamadı. Kanal aktif olmayabilir.')}},

const A={chs:[],flt:[],cats:[],curC:'all',curI:-1,area:'grid',_fi:-1,
async init(){msg('Sistem hazırlanıyor...');V.init();this.clk();msg('Kanallar yükleniyor...');await this.loadChs();this.bind();this.bindRC();setTimeout(()=>{const sp=$('splash');sp.classList.add('fade');setTimeout(()=>{sp.classList.add('hidden');$('app').classList.remove('hidden')},600);setTimeout(()=>this.focCard(0),400)},1200);try{if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}},
async loadChs(){const cf=S.cf(),ca=S.ca();if(ca&&ca.d&&(Date.now()-ca.t<cf.interval)){this.chs=ca.d;msg('Cache yüklendi')}else{try{msg('M3U indiriliyor...');const txt=await fetchM3U(cf.url);this.chs=parseM3U(txt);this.chs.forEach((c,i)=>c.num=i+1);S.sCa(this.chs);S.sCf({lastUp:Date.now()});msg(this.chs.length+' kanal yüklendi')}catch(e){msg('Hata! Cache deneniyor...');if(ca&&ca.d)this.chs=ca.d;else{this.chs=[];msg('Kanal yüklenemedi')}}}this.cats=getCats(this.chs);this.renderCats();this.filter('all');$('chCnt').textContent=this.chs.length+' kanal'},

renderGrid(){const g=$('grd'),nd=$('noD');if(!this.flt.length){g.innerHTML='';nd.classList.remove('hidden');return}nd.classList.add('hidden');g.innerHTML=this.flt.map(ch=>{const fv=S.isFav(ch.id)?'fav':'';const logo=ch.logo?`<img class="crd-img" src="${ch.logo}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`:'';const ph=`<div class="crd-ph" style="${ch.logo?'display:none':''}">${ch.name.charAt(0).toUpperCase()}</div>`;return`<div class="crd ${fv}" data-id="${ch.id}"><span class="crd-n">${ch.num}</span><span class="crd-f"><i class="fas fa-star"></i></span>${logo}${ph}<div class="crd-nm">${ch.name}</div><span class="crd-gr">${ch.group}</span></div>`}).join('')},

tMini(){const e=$('mL');if(e.classList.contains('hidden')){this.renderMini();e.classList.remove('hidden');this.area='mini'}else{e.classList.add('hidden');this.area='player'}},
renderMini(){const cur=V.ch?.id;$('mLi').innerHTML=this.flt.map(ch=>{const a=ch.id===cur?'act':'';const img=ch.logo?`<img src="${ch.logo}" onerror="this.style.display='none'">`:`<div style="width:26px;height:26px;border-radius:5px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;color:#fff">${ch.name.charAt(0)}</div>`;return`<div class="mi ${a}" data-id="${ch.id}"><span class="mi-n">${ch.num}</span>${img}<span class="mi-nm">${ch.name}</span></div>`}).join('')},
tFav(){if(this.pVis()&&V.ch){const a=S.tFav(V.ch.id);V.updFav();V.showTxt(a?'⭐ Favorilere eklendi':'☆ Favoriden çıkarıldı')}else{const fc=document.querySelector('.crd.foc');if(fc){const id=fc.dataset.id;const a=S.tFav(id);fc.classList.toggle('fav',a)}}},
openAdm(){const p=prompt('Admin Şifresi:');if(p!==S.cf().pass){if(p!==null)alert('Yanlış şifre!');return}this.renderAdm()},closeAdm(){const o=document.querySelector('.adm-ov');if(o)o.remove()},
renderAdm(){this.closeAdm();const cf=S.cf(),cats=this.cats;const ov=document.createElement('div');ov.className='adm-ov';ov.innerHTML=`<div class="adm-box"><div class="adm-hd"><h2><i class="fas fa-cog"></i> Admin Panel</h2><button class="adm-cl" onclick="A.closeAdm()"><i class="fas fa-times"></i></button></div><div class="adm-bd"><div class="adm-nv"><button class="act" onclick="admS('dash',this)"><i class="fas fa-tachometer-alt"></i> Dashboard</button><button onclick="admS('pl',this)"><i class="fas fa-list"></i> Playlist</button><button onclick="admS('ch',this)"><i class="fas fa-tv"></i> Kanallar</button><button onclick="admS('set',this)"><i class="fas fa-sliders-h"></i> Ayarlar</button><button onclick="admS('bk',this)"><i class="fas fa-database"></i> Yedekleme</button></div><div class="adm-ct"><div class="adm-s act" id="a-dash"><h3>Dashboard</h3><div class="sts"><div class="st"><div style="font-size:24px;font-weight:700">${this.chs.length}</div><div>Toplam Kanal</div></div><div class="st"><div style="font-size:24px;font-weight:700">${cats.length}</div><div>Kategori</div></div><div class="st"><div style="font-size:24px;font-weight:700">${S.favs().length}</div><div>Favori</div></div><div class="st"><div style="font-size:24px;font-weight:700">${S.rec().length}</div><div>Son İzlenen</div></div></div></div><div class="adm-s" id="a-pl"><h3>Playlist</h3><div class="fg"><label>M3U URL</label><input id="aUrl" value="${cf.url}"></div><div class="fg"><label>Güncelleme Aralığı</label><select id="aInt"><option value="1800000">30 dk</option><option value="3600000" selected>1 saat</option><option value="21600000">6 saat</option><option value="86400000">24 saat</option></select></div><div style="display:flex;gap:6px"><button class="btn btn-p" onclick="S.sCf({url:$('aUrl').value,interval:+$('aInt').value});alert('Kaydedildi!')">Kaydet</button><button class="btn btn-s" onclick="S.d('cache');location.reload()">Güncelle</button></div><div class="alr">Son güncelleme: ${cf.lastUp?new Date(cf.lastUp).toLocaleString('tr-TR'):'Hiç'}</div><h3 style="margin-top:16px">Manuel Kanal</h3><div class="fg"><label>Kanal Adı</label><input id="mNm"></div><div class="fg"><label>URL</label><input id="mUr"></div><div class="fg"><label>Kategori</label><input id="mGr" value="Özel"></div><div class="fg"><label>Logo</label><input id="mLo"></div><div class="fg"><label>Referer</label><input id="mRef"></div><button class="btn btn-p" onclick="A.addCh()">Ekle</button></div><div class="adm-s" id="a-ch"><h3>Kanallar (${this.chs.length})</h3><div class="fg"><input id="aSrc" placeholder="Ara..." oninput="A.fltAdm(this.value)"></div><div style="max-height:350px;overflow-y:auto" id="aChL"></div></div><div class="adm-s" id="a-set"><h3>Ayarlar</h3><div class="fg"><label>Admin Şifresi</label><input id="aPas" value="${cf.pass}"></div><div class="fg"><label>Varsayılan Ses</label><input type="range" id="aVol" min="0" max="100" value="${cf.vol}"></div><button class="btn btn-p" onclick="S.sCf({pass:$('aPas').value,vol:+$('aVol').value});alert('Kaydedildi!')">Kaydet</button></div><div class="adm-s" id="a-bk"><h3>Yedekleme</h3><button class="btn btn-p" onclick="A.exp()">Dışa Aktar</button> <button class="btn btn-d" onclick="S.d('cache');alert('Cache temizlendi!')">Cache Temizle</button> <button class="btn btn-d" onclick="if(confirm('TÜM veriler silinecek!')){S.clr();location.reload()}">Sıfırla</button><div class="alr">Depolama: ~${(JSON.stringify(localStorage).length/1024).toFixed(1)} KB</div></div></div></div></div>`;document.body.appendChild(ov);this.fillAdm(this.chs.slice(0,150))},
fillAdm(list){const el=$('aChL');if(!el)return;el.innerHTML=`<table style="width:100%;font-size:12px">${list.map(c=>`<tr style="border-bottom:1px solid var(--brd)"><td style="padding:5px">${c.num}</td><td style="padding:5px">${c.name}</td><td style="padding:5px;color:var(--txt3)">${c.group}</td><td style="padding:5px">${c.type}</td></tr>`).join('')}</table>`},

addCh(){const n=$('mNm').value.trim(),u=$('mUr').value.trim();if(!n||!u){alert('Ad ve URL gerekli!');return}const headers={};const ref=$('mRef').value.trim();if(ref)headers['Referer']=ref;const ch={id:n.toLowerCase().replace(/[^a-z0-9]/g,'_')+'_'+Date.now(),num:this.chs.length+1,name:n,url:u,group:$('mGr').value.trim()||'Özel',logo:$('mLo').value.trim(),type:'hls',headers};this.chs.push(ch);S.sCa(this.chs);this.cats=getCats(this.chs);this.renderCats();this.filter(this.curC);alert('"'+n+'" eklendi!')},
exp(){const d={};Object.keys(localStorage).filter(k=>k.startsWith('tv_')).forEach(k=>d[k.replace('tv_','')]=JSON.parse(localStorage.getItem(k)));const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='tivim_backup.json';a.click()},
clk(){const u=()=>{const t=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});$('clk').textContent=t;$('pClk').textContent=t};u();setInterval(u,1000)},
focCard(i){const cards=document.querySelectorAll('#grd .crd');cards.forEach(c=>c.classList.remove('foc'));if(i<0||i>=cards.length)return;this._fi=i;cards[i].classList.add('foc');cards[i].scrollIntoView({behavior:'smooth',block:'nearest'});this.area='grid'},
focCat(dir){const bs=[...document.querySelectorAll('.cat')];let fi=bs.findIndex(b=>b.classList.contains('foc'));bs.forEach(b=>b.classList.remove('foc'));if(dir==='r')fi=Math.min(bs.length-1,fi+1);else fi=Math.max(0,fi-1);if(fi<0)fi=0;bs[fi].classList.add('foc');bs[fi].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});this.area='cats'},
actCat(){const b=document.querySelector('.cat.foc');if(b){this.filter(b.dataset.c);setTimeout(()=>this.focCard(0),50)}},
navG(d){const cards=document.querySelectorAll('#grd .crd');if(!cards.length)return;const cols=Math.max(1,Math.round($('grd').clientWidth/(cards[0].offsetWidth+10)));let fi=this._fi;if(fi<0)fi=0;switch(d){case'u':if(fi<cols){this.toCats();return}fi-=cols;break;case'd':fi=Math.min(cards.length-1,fi+cols);break;case'l':fi=Math.max(0,fi-1);break;case'r':fi=Math.min(cards.length-1,fi+1);break}this.focCard(fi)},
toCats(){document.querySelectorAll('#grd .crd').forEach(c=>c.classList.remove('foc'));const a=document.querySelector('.cat.act')||document.querySelector('.cat');if(a){document.querySelectorAll('.cat').forEach(b=>b.classList.remove('foc'));a.classList.add('foc');this.area='cats'}},

navM(d){const its=[...document.querySelectorAll('.mi')];if(!its.length)return;let fi=its.findIndex(i=>i.classList.contains('foc'));its.forEach(i=>i.classList.remove('foc'));if(d==='u')fi=Math.max(0,fi-1);else if(d==='d')fi=Math.min(its.length-1,fi+1);else if(d==='l'){this.tMini();return}if(fi<0)fi=0;its[fi].classList.add('foc');its[fi].scrollIntoView({behavior:'smooth',block:'nearest'})},

_nb:'',_nt:null,
bindRC(){document.addEventListener('keydown',e=>{const k=e.keyCode;if(document.activeElement.tagName==='INPUT'||document.activeElement.tagName==='TEXTAREA'||document.activeElement.tagName==='SELECT'){if(k===27||k===4){document.activeElement.blur();e.preventDefault();return}if(k===13&&document.activeElement.id==='srcIn'){this.search(document.activeElement.value);document.activeElement.blur();e.preventDefault()}return}e.preventDefault();const pv=this.pVis(),mo=!$('mL').classList.contains('hidden'),ao=!!document.querySelector('.adm-ov');if([27,4,8,461].includes(k)){if(ao){this.closeAdm();return}if(mo){this.tMini();return}if(pv){V.cVis?V.hideC():this.closeP();return}if($('srcIn').value){$('srcIn').value='';this.search('');return}return}if(ao)return;if([38,19].includes(k)){if(mo)this.navM('u');else if(pv&&!V.cVis){V.showC();this.area='player'}else if(!pv&&this.area!=='cats')this.navG('u')}else if([40,20].includes(k)){if(mo)this.navM('d');else if(pv&&!V.cVis){V.showC();this.area='player'}else if(!pv&&this.area==='cats')this.focCard(0);else if(!pv)this.navG('d')}else if([37,21].includes(k)){if(mo)this.navM('l');else if(pv&&V.cVis)this.navP('l');else if(pv&&!V.cVis){V.showC();this.area='player'}else if(this.area==='cats')this.focCat('l');else if(!pv)this.navG('l')}else if([39,22].includes(k)){if(pv&&V.cVis)this.navP('r');else if(pv&&!V.cVis){V.showC();this.area='player'}else if(this.area==='cats')this.focCat('r');else if(!pv)this.navG('r')}else if([13,23,66].includes(k)){if(mo)this.actM();else if(pv&&V.cVis)this.actP();else if(pv&&!V.cVis){V.showC();this.area='player'}else if(this.area==='cats')this.actCat();else{const fc=document.querySelector('.crd.foc');if(fc)this.playCh(fc.dataset.id)}}else if([175,24].includes(k))V.vUp();else if([174,25].includes(k))V.vDn();else if([173,164].includes(k))V.tMute();else if([33,166].includes(k)){if(pv)this.nextCh()}else if([34,167].includes(k)){if(pv)this.prevCh()}else if([179,85,415].includes(k)){if(pv)V.tPP()}else if([178,86].includes(k)){if(pv)this.closeP()}else if(this.isN(k))this.hNum(this.toN(k));else if([217,84].includes(k))$('srcIn').focus();else if([182,364,405].includes(k))this.tFav();else if([93,82].includes(k))this.openAdm();else if([457,165].includes(k)){if(pv)V.showC()}else if([458,172,406].includes(k)){if(pv)this.tMini()}else if([403].includes(k)){try{document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}}else if([404].includes(k)){if(pv)V.cyAsp()}})},
isN(k){return(k>=48&&k<=57)||(k>=96&&k<=105)},toN(k){return k>=96?k-96:k-48},
hNum(n){this._nb+=n;if(this.pVis()){$('osdN').textContent=this._nb;const ch=this.chByNum(parseInt(this._nb));$('osdNm').textContent=ch?ch.name:'';$('osdCh').classList.remove('hidden')}clearTimeout(this._nt);this._nt=setTimeout(()=>{const ch=this.chByNum(parseInt(this._nb));if(ch)this.playCh(ch.id);this._nb='';$('osdCh').classList.add('hidden')},2000)}};
function admS(n,btn){document.querySelectorAll('.adm-s').forEach(s=>s.classList.remove('act'));document.querySelectorAll('.adm-nv button').forEach(b=>b.classList.remove('act'));const el=document.getElementById('a-'+n);if(el)el.classList.add('act');btn.classList.add('act')}
